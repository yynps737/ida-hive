[package]
name = "ida-hive"
version = "0.4.0"
edition = "2021"
description = "Native multi-instance IDA Pro MCP server — Rust coordinator + C++ idalib workers"

[dependencies]
# MCP protocol — rmcp 3.x targets the 2026-07-28 spec. The "schemars" feature
# re-exports schemars so tool parameter structs derive JsonSchema without a
# separate, version-skewed schemars dependency.
rmcp = { version = "3.1", features = ["server", "macros", "transport-io", "schemars"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
